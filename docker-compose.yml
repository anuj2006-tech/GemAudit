version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: tender_redis_broker
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    container_name: tender_backend_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  frontend:
    build: ./frontend
    container_name: tender_frontend_web
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
