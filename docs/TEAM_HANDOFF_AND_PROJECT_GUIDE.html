<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeM Audit AI - Platform Architecture & Team Handoff Guide</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --border: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 48px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1, h2, h3, h4 {
      color: #fff;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    h1 {
      color: var(--accent);
      font-size: 2.2rem;
      border-bottom: 2px solid var(--accent);
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    pre {
      background: #06090e;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border);
    }
    code {
      font-family: Consolas, Monaco, "Courier New", monospace;
      color: #e2e8f0;
      font-size: 0.95em;
    }
    p code, li code {
      background: #06090e;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
    }
    blockquote {
      border-left: 4px solid var(--accent);
      margin: 16px 0;
      padding: 10px 20px;
      background: var(--accent-glow);
      border-radius: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 12px 14px;
      text-align: left;
    }
    th {
      background: #090d16;
      color: var(--accent);
    }
    tr:nth-child(even) {
      background: rgba(255,255,255,0.02);
    }
    .print-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #059669;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .print-btn:hover {
      background: #047857;
    }
    @media print {
      body {
        background: white;
        color: black;
        padding: 0;
      }
      .container {
        background: white;
        box-shadow: none;
        border: none;
        padding: 0;
        max-width: 100%;
      }
      .print-btn {
        display: none;
      }
      h1, h2, h3, h4 {
        color: black;
        border-color: #ddd;
      }
      pre, code {
        background: #f4f4f4;
        color: black;
        border-color: #ccc;
      }
    }
  </style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
  <div class="container" id="content">Loading documentation...</div>

  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    fetch('TEAM_HANDOFF_AND_PROJECT_GUIDE.md')
      .then(response => response.text())
      .then(markdown => {
        document.getElementById('content').innerHTML = marked.parse(markdown);
        document.querySelectorAll('pre code.language-mermaid').forEach((el) => {
          const pre = el.parentElement;
          const graphDefinition = el.innerText;
          const graphContainer = document.createElement('div');
          graphContainer.className = 'mermaid';
          graphContainer.textContent = graphDefinition;
          pre.replaceWith(graphContainer);
        });
        mermaid.run();
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<p>Error loading guide. Please open <code>TEAM_HANDOFF_AND_PROJECT_GUIDE.md</code> directly.</p>';
      });
  </script>
</body>
</html>
