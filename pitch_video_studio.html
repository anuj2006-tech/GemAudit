<html lang="en">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .glow-effect { animation: pulseGlow 4s infinite ease-in-out; }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes laserVerticalSweep {
      0% { top: 0%; opacity: 0.85; }
      48% { opacity: 1; }
      50% { top: 96%; opacity: 0.9; }
      98% { opacity: 1; }
      100% { top: 0%; opacity: 0.85; }
    }
    @keyframes laserAngleSweep {
      0% { transform: translateY(-70%) rotate(-12deg); opacity: 0.7; }
      50% { transform: translateY(75%) rotate(-12deg); opacity: 1; }
      100% { transform: translateY(-70%) rotate(-12deg); opacity: 0.7; }
    }
    .animate-laser-sweep { animation: laserVerticalSweep 3s ease-in-out infinite; }
    .animate-laser-angle { animation: laserAngleSweep 3.2s ease-in-out infinite; }
  </style>
</head>

      {

        voiceover: "GeM Audit slashes tender evaluation time from seven days down to just eight minutes—eliminating fake bids and saving thousands of crores. We are building a faster, smarter, and truly corruption-free public procurement ecosystem for India.",
        subtitles: [
          { text: "Evaluation time slashed from 7 days down to just 8 minutes—96% faster.", start: 0, end: 6 },
          { text: "Eliminating fake bids completely and saving thousands of crores.", start: 6, end: 11 },
          { text: "Building a faster, smarter, and truly corruption-free procurement ecosystem for India.", start: 11, end: 17 }
        ],
        render: () => `
          <div class="w-full h-full relative flex flex-col justify-center items-center p-6 lg:p-12 fade-in bg-slate-950 text-center space-y-5">
            <div class="space-y-1">
              <h1 class="text-3xl lg:text-5xl font-black text-white tracking-tight">Fast, Simple &amp; Honest Bidding</h1>
              <p class="text-xs lg:text-sm text-slate-400">Real, measurable speed and trust for government purchasing.</p>

                <div class="text-xs font-bold text-slate-200">Faster Checking</div>
                <div class="text-[11px] text-slate-400">7 Days → 8 Minutes</div>
              </div>
              <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-1">
                <div class="text-2xl lg:text-3xl font-black text-cyan-400">0%</div>
                <div class="text-xs font-bold text-slate-200">Fake Papers</div>
                <div class="text-[11px] text-slate-400">Direct Government Check</div>
              </div>
              <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-1">
                <div class="text-2xl lg:text-3xl font-black text-amber-400">100%</div>
                <div class="text-xs font-bold text-slate-200">Permanent Proof</div>
                <div class="text-[11px] text-slate-400">Digital Safety Seals</div>
              </div>
            </div>
            <div class="text-xs text-slate-400 font-mono">GeM Audit AI • Making Government Procurement Honest &amp; Fast</div>
          </div>
        `
      }
    ];

    let currentSceneIdx = 0;
    let isPlaying = false;
    let isMuted = false;
    let timerInterval = null;
    let sceneProgress = 0;
    let overallTime = 0;
    let voiceMode = 'female'; // 'female' | 'male'
    const audioPlayer = new Audio();
    const totalDuration = SCENES.reduce((acc, s) => acc + s.duration, 0);

    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    function renderScene() {
      const scene = SCENES[currentSceneIdx];
      document.getElementById('sceneViewport').innerHTML = scene.render();
      document.getElementById('sceneTag').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> ${scene.tag}`;
      document.getElementById('sceneTitle').innerText = `Scene ${scene.id}: ${scene.title}`;
      document.getElementById('sceneCounter').innerText = `Scene ${currentSceneIdx + 1} / ${SCENES.length}`;
      updateSubtitle();
      updatePills();
    }

    function updateSubtitle() {
      const scene = SCENES[currentSceneIdx];
      const elapsed = (sceneProgress / 100) * scene.duration;
      const sub = scene.subtitles.find(s => elapsed >= s.start && elapsed <= s.end) || scene.subtitles[0];
      document.getElementById('subtitleText').innerText = `"${sub.text}"`;
    }

    function buildTimeline() {
      const timeline = document.getElementById('timelineBar');
      timeline.innerHTML = '';
      SCENES.forEach((s, idx) => {
        const seg = document.createElement('div');
        seg.style.width = `${(s.duration / totalDuration) * 100}%`;
        seg.className = 'h-full border-r border-slate-950 relative';
        seg.innerHTML = `<div id="seg-fill-${idx}" class="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 transition-all duration-100" style="width: 0%"></div>`;
        timeline.appendChild(seg);
      });
    }

    function buildPills() {
      const container = document.getElementById('scenePills');
      container.innerHTML = '';
      SCENES.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.id = `pill-${idx}`;
        btn.onclick = () => jumpToScene(idx);
        btn.className = `px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
          idx === currentSceneIdx 
            ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' 
            : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800'
        }`;
        btn.innerText = `Scene ${s.id}`;
        container.appendChild(btn);
      });
    }

    function updatePills() {
      SCENES.forEach((s, idx) => {
        const btn = document.getElementById(`pill-${idx}`);
        if (!btn) return;
        if (idx === currentSceneIdx) {
          btn.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold transition bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
        } else {
          btn.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold transition bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800';
        }
      });
    }

    function buildStoryboard() {
      const grid = document.getElementById('storyboardGrid');
      grid.innerHTML = '';
      SCENES.forEach((s, idx) => {
        const card = document.createElement('div');
        card.onclick = () => jumpToScene(idx);
        card.className = 'p-4 rounded-xl border border-slate-800/80 bg-slate-950/60 hover:border-slate-700 cursor-pointer transition';
        card.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-emerald-400">SCENE ${s.id} (${s.duration}s)</span>
            <span class="text-[10px] text-slate-500 uppercase font-mono">${s.tag}</span>
          </div>
          <h4 class="text-sm font-bold text-white mb-1.5">${s.title}</h4>
          <p class="text-xs text-slate-400 line-clamp-3 leading-relaxed">${s.voiceover}</p>
        `;
        grid.appendChild(card);
      });
    }

    function formatSpeechText(text) {
      if (!text) return '';
      return text
        // Fix 'AI' pronunciation so TTS speaks 'A. I.' (Ay-Eye) instead of 'eye' or 'ay'
        .replace(/\bAI\b/g, 'A. I.')
        .replace(/\bAi\b/g, 'A. I.')
        .replace(/\bA\.I\.\b/g, 'A. I.')
        .replace(/\bA\.I\b/g, 'A. I.')
        .replace(/₹/g, 'rupees ')
        .replace(/\bCr\b/gi, 'crore')
        .replace(/\bLakh\b/gi, 'lakh');
    }

    function onVoiceModeChange(mode) {
      voiceMode = mode;
      if (voiceMode === 'studio') {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } else {
        audioPlayer.pause();
      }
      const label = document.getElementById('muteLabel');
      if (!isMuted && label) {
        label.innerText = voiceMode === 'studio' ? 'Studio Voice Active' : 'AI Voice Active';
      }
      if (isPlaying) {
        playSceneAudio();
      }
    }

    function playSceneAudio() {
      if (isMuted) return;
      const scene = SCENES[currentSceneIdx];
      const audioUrl = voiceMode === 'male' 
        ? `frontend/public/audio/pitch_male/scene${scene.id}.mp3` 
        : `frontend/public/audio/pitch/scene${scene.id}.mp3`;

      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      audioPlayer.pause();
      audioPlayer.src = audioUrl;
      audioPlayer.currentTime = 0;
      audioPlayer.play().catch(() => {});
    }

    function onVoiceModeChange(mode) {
      voiceMode = mode;
      if (isPlaying) {
        const scene = SCENES[currentSceneIdx];
        const audioUrl = voiceMode === 'male' 
          ? `frontend/public/audio/pitch_male/scene${scene.id}.mp3` 
          : `frontend/public/audio/pitch/scene${scene.id}.mp3`;
        audioPlayer.pause();
        audioPlayer.src = audioUrl;
        audioPlayer.currentTime = (sceneProgress / 100) * scene.duration;
        audioPlayer.play().catch(() => {});
      }
    }

    function speakVoiceover() {
      if (isMuted || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const formatted = formatSpeechText(SCENES[currentSceneIdx].voiceover);
      const utterance = new SpeechSynthesisUtterance(formatted);
      utterance.rate = 1.02;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('India') || v.name.includes('English (India)')) && v.lang.startsWith('en')) || voices.find(v => v.lang.startsWith('en'));
      if (preferredVoice) utterance.voice = preferredVoice;

      window.speechSynthesis.speak(utterance);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const icon = document.getElementById('playIcon');
      const bottomControls = document.getElementById('bottomControls');
      const subtitleContainer = document.getElementById('subtitleContainer');

      if (isPlaying) {
        icon.className = 'fa-solid fa-pause';
        if (bottomControls) {
          bottomControls.className = 'absolute bottom-0 left-0 right-0 z-40 p-4 bg-gradient-to-t from-slate-950 via-slate-950/95 to-transparent border-t border-slate-800/80 flex flex-col gap-2 transition-all duration-300 opacity-0 translate-y-3 pointer-events-none group-hover:opacity-100 group-hover:translate-y-0 group-hover:pointer-events-auto';
        }
        if (subtitleContainer) {
          subtitleContainer.className = 'absolute bottom-6 left-6 right-6 z-30 flex justify-center pointer-events-none transition-all duration-300';
        }
        playSceneAudio();
        timerInterval = setInterval(onTick, 100);
      } else {
        icon.className = 'fa-solid fa-play ml-0.5';
        if (bottomControls) {
          bottomControls.className = 'absolute bottom-0 left-0 right-0 z-40 p-4 bg-gradient-to-t from-slate-950 via-slate-950/95 to-transparent border-t border-slate-800/80 flex flex-col gap-2 transition-all duration-300 opacity-100 translate-y-0 pointer-events-auto';
        }
        if (subtitleContainer) {
          subtitleContainer.className = 'absolute bottom-20 left-6 right-6 z-30 flex justify-center pointer-events-none transition-all duration-300';
        }
        audioPlayer.pause();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        clearInterval(timerInterval);
      }
    }

    function onTick() {
      const scene = SCENES[currentSceneIdx];
      const step = 100 / (scene.duration * 10);
      sceneProgress += step;
      overallTime += 0.1;

      // Update segment fill
      const segFill = document.getElementById(`seg-fill-${currentSceneIdx}`);
      if (segFill) segFill.style.width = `${Math.min(sceneProgress, 100)}%`;

      document.getElementById('timecode').innerText = `${formatTime(overallTime)} / ${formatTime(totalDuration)}`;
      updateSubtitle();

      if (sceneProgress >= 100) {
        // Let studio audio finish speaking naturally if still playing
        if (voiceMode === 'studio' && !audioPlayer.paused && !audioPlayer.ended && !isMuted) {
          return;
        }
        // Let browser voiceover finish naturally if still speaking
        if (voiceMode === 'browser' && 'speechSynthesis' in window && window.speechSynthesis.speaking && !isMuted) {
          return;
        }
        if (currentSceneIdx < SCENES.length - 1) {
          jumpToScene(currentSceneIdx + 1);
        } else {
          togglePlay();
          sceneProgress = 100;
        }
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function jumpToScene(idx) {
      audioPlayer.pause();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentSceneIdx = idx;
      sceneProgress = 0;
      SCENES.forEach((s, i) => {
        const f = document.getElementById(`seg-fill-${i}`);
        if (f) f.style.width = i < idx ? '100%' : '0%';
      });
      overallTime = SCENES.slice(0, idx).reduce((acc, s) => acc + s.duration, 0);
      renderScene();
      if (isPlaying) {
        playSceneAudio();
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      audioPlayer.muted = isMuted;
      const icon = document.getElementById('muteIcon');
      const label = document.getElementById('muteLabel');
      if (isMuted) {
        icon.className = 'fa-solid fa-volume-xmark text-rose-400';
        label.innerText = 'Muted';
        audioPlayer.pause();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } else {
        icon.className = 'fa-solid fa-volume-high text-emerald-400';
        label.innerText = voiceMode === 'studio' ? 'Studio Voice Active' : 'AI Voice Active';
        if (isPlaying) playSceneAudio();
      }
    }

    function toggleFullscreen() {
      const el = document.getElementById('videoContainer');
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    async function toggleRecording() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
          recordedChunks = [];
          mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `GeM_Audit_Pitch_Video_${Date.now()}.webm`;
            a.click();
            document.getElementById('recordBtn').innerHTML = `<i class="fa-solid fa-circle-dot"></i><span>Record & Download (.webm)</span>`;
            document.getElementById('recordBtn').className = 'px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/30 flex items-center gap-2 transition';
            isRecording = false;
          };
          mediaRecorder.start();
          isRecording = true;
          document.getElementById('recordBtn').innerHTML = `<i class="fa-solid fa-stop text-white"></i><span>Stop & Save Recording</span>`;
          document.getElementById('recordBtn').className = 'px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-rose-600/30 flex items-center gap-2 animate-pulse';
          jumpToScene(0);
          if (!isPlaying) togglePlay();
        } catch (err) {
          console.error(err);
        }
      } else {
        if (mediaRecorder) mediaRecorder.stop();
      }
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      buildTimeline();
      buildPills();
      buildStoryboard();
      renderScene();
    });
  </script>
